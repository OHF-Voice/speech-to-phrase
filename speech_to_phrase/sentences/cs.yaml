---
language: "cs"

lists:
  color:
    - "bílou"
    - "černou"
    - "červenou"
    - "oranžovou"
    - "žlutou"
    - "zelenou"
    - "modrou"
    - "fialovou"
    - "hnědou"
    - "růžovou"
    - "tyrkysovou"

wildcards:
  - "todo_item"

data:
  # cancel
  - "[to] nevadí"
  - "zapomeň na to"

  # date and time
  - "kolik je [teď] hodin"
  - "jaké je [dne(s|šní)] datum"
  - "co je dnes za den"

  # weather
  - "jaké (je|bude) počasí"
  - sentences:
      - "jaké (je|bude) počasí [v|ve|na] {name}"
    domains:
      - "weather"

  # lights (area)
  - "(zapn|vypn)(i|out) [všechna] světla [tady]"
  - "(zapn|vypn)(i|out) [všechna] světla [v|ve|na] {area}"
  - "nastav[it] jas (světla|světel) na {brightness} [procent]"
  - "nastav[it] jas [v|ve|na] {area} na {brightness} [procent]"
  - "nastav[it] světla na {color}"
  - "nastav[it] barvu světla na {color}"
  - "nastav[it] světla [v|ve|na] {area} na {color}"
  - "nastav[it] barvu světla [v|ve|na] {area} na {color}"

  # lights (name)
  - sentences:
      - "nastav[it] jas {name} na {brightness} [procent]"
    domains:
      - "light"
    light_supports_brightness: true

  - sentences:
      - "nastav[it] barvu {name} na {color}"
    domains:
      - "light"
    light_supports_color: true

  # doors and windows
  - "(otevř(i|ít)|zavř(i|ít)) (žaluzie|rolet(y|u)|okn(a|o)) [v|ve|na] {area}"
  - sentences:
      - "(otevř(i|ít)|zavř(i|ít)) {name}"
      - "(otevř(i|ít)|zavř(i|ít)) {name} [v|ve|na] {area}"
      - "(je|jsou) {name} (otevřen[y|a]|zavřeny)"
    domains:
      - "cover"

  # locks
  - sentences:
      - "((za|ode)mkn(i|out)) {name}"
      - "(je|jsou) {name} (za|ode)mčeny"
    domains:
      - "lock"

  # generic on/off
  - sentences:
      - "(zapn|vypn)(i|out) {name}"
      - "(je|jsou) {name} (zap|vyp)nut(a|y)"
    domains:
      - "switch"
      - "fan"
      - "media_player"
      - "input_boolean"

  # scripts and scenes
  - sentences:
      - "(aktiv(uj|ovat)|spusti[t]) skript {name}"
    domains:
      - "script"

  - sentences:
      - "aktiv(uj|ovat) scénu {name}"
    domains:
      - "scene"

  # timers
  - "(nastav[it]|spusti[t]) časovač na {seconds} (vteřin[y]|sekund[y])"
  - "(nastav[it]|spusti[t]) časovač na 1 minutu"
  - "(nastav[it]|spusti[t]) časovač na {minutes} minut[y]"
  - "(nastav[it]|spusti[t]) časovač na 1 minutu a {seconds} (sekund[y]|vteřin[y])"
  - "(nastav[it]|spusti[t]) časovač na {minutes} minut[u|y] a {seconds} (sekund[y]|vteřin[y])"
  - "(nastav[it]|spusti[t]) časovač na jednu hodinu"
  - "(nastav[it]|spusti[t]) časovač na {hours} hodin[y]"
  - "(nastav[it]|spusti[t]) časovač na 1 hodinu a 1 minutu"
  - "(nastav[it]|spusti[t]) časovač na 1 hodinu a {minutes} minut[u|y]"
  - "(nastav[it]|spusti[t]) časovač na {hours} hodin[u|y] a {minutes} minut[u|y]"

  - "(zruš[it]|zastav[it]) časovač"
  - "(přeruš[it]|obnov[it]) časovač"
  - "stav časovače"
  - "kolik času zbývá na časovači"

  # media
  - "(pauza|pokrač(uj|ovat))"
  - "další [(stopa|skladba|položka|písnička)]"
  - "přeskoč [[tuto ](stopu|skladbu|položku|písničku)]"
  - sentences:
      - "(přeruš[it]|obnovit) {name}"
      - "další [(stopa|skladba|položka|písnička)] [na|v|ve] {name}"
      - "přeskoč [[tuto ](stopu|skladbu|položku|písničku)] [na|v|ve] {name}"
    domains:
      - "media_player"

  # temperature
  - "jaká je [tady] teplota"
  - "kolik je [tady] stupňů"
  - "jaká je teplota [v|ve|na] {area}"
  - "kolik je [v|ve|na] {area} stupňů"
  - sentences:
      - "jaká je teplota [v|ve|na] {name}"
      - "kolik (je|má) stupňů [v|ve|na] {name}"
    domains:
      - "climate"

  # sensors
  # - sentences:
  #     - "what is [the [value of [the]]] {name}"
  #   domains:
  #     - "sensor"

  # todo
  - sentences:
      - "při(dej|piš) {todo_item} (na|do) [mého|můj] seznam {name}"
    domains:
      - "todo"
